site_name: Proxmox Community
site_url: https://proxmox.community/
site_description: Practical, step-by-step Proxmox VE 9 labs on a real lab, from zero to hero.
site_author: Nicola Marco Decandia
repo_url: https://github.com/ndecandia/NextGuard
repo_name: ndecandia/NextGuard
edit_uri: edit/main/docs/
copyright: >-
  &copy; 2026 Nicola Marco Decandia &middot; Content licensed under CC BY-SA 4.0, code under MIT.<br>
  Proxmox&reg; is a registered trademark of Proxmox Server Solutions GmbH.
  This project is independent and is not affiliated with, sponsored or endorsed by Proxmox Server Solutions GmbH.

docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.footer
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ndecandia/NextGuard
      name: Proxmox Community on GitHub

plugins:
  - search:
      lang:
        - en
        - it
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          # The labs are being translated: until the English edition is complete the
          # English navigation lists only the pages that already exist in English.
          nav:
            - Home: index.md
            - Contribute: contributing.md
            - About: about.md
        - locale: it
          name: Italiano
          build: true
          site_description: Laboratori pratici su Proxmox VE 9, passo per passo, su un laboratorio reale.
          copyright: >-
            &copy; 2026 Nicola Marco Decandia &middot; Contenuti con licenza CC BY-SA 4.0, codice con licenza MIT.<br>
            Proxmox&reg; è un marchio registrato di Proxmox Server Solutions GmbH.
            Questo progetto è indipendente e non è affiliato, sponsorizzato o approvato da Proxmox Server Solutions GmbH.
          nav_translations:
