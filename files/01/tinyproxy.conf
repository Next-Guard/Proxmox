# /etc/tinyproxy/tinyproxy.conf su netsvc (solo le righe attive)
User tinyproxy
Group tinyproxy
Port 3128
Listen 172.27.199.250
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 100
Allow 172.27.199.0/24
ViaProxyName "netsvc"
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterDefaultDeny Yes
FilterURLs Off
ConnectPort 443
ConnectPort 80
